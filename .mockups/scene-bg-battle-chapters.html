<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배틀 배경 1·2·3장 전후 비교</title>
<style>
:root{--bg:#0b0d12;--fg:#e5e7eb;--muted:#9ca3af;--line:#262b36;--card:#141821;--acc:#5ef0b4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}h2{font-size:17px;margin:0}
p.sub{color:var(--muted);font-size:13.5px;margin:0 0 6px}
section{margin:26px 0;padding-top:12px;border-top:1px solid var(--line)}
.cmp{position:relative;width:100%;aspect-ratio:1600/704;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;user-select:none}
.cmp img,.cmp canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.cmp canvas{clip-path:inset(0 0 0 var(--x,50%))}
.cmp .ln{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:#f7c64a;box-shadow:0 0 8px #f7c64a;pointer-events:none}
.tag{position:absolute;top:8px;padding:2px 9px;border-radius:999px;font-size:12px;background:rgba(0,0,0,.65);border:1px solid #48546e;color:#e5e7eb;pointer-events:none}
.tag.l{left:10px}.tag.r{right:10px;border-color:#f7c64a;color:#f7c64a}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.ctl button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:4px 12px;font:inherit;font-size:12.5px;min-height:30px;cursor:pointer}
.ctl input[type=range]{flex:1;min-width:160px;accent-color:#f7c64a}
ul{margin:6px 0 0;padding-left:18px;font-size:13px}li{margin:2px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>배틀 배경 — 1·2·3장 전/후 비교</h1>
<p class="sub">슬라이더를 좌우로 움직이면 왼쪽이 <b>현재(전)</b>, 오른쪽이 <b>시안(후)</b>. 후 쪽은 장별 분위기 효과가 움직인다. 전 이미지는 서버 실행(<code>node .mockups/server.js</code>) 시 표시된다.</p>
<div id="root"></div>
</div>
<script>
const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const hash=(a,b)=>{let h=(a*374761393+b*668265263)>>>0;h=(h^(h>>>13))*1274126177>>>0;return((h^(h>>>16))>>>0)/4294967296};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rgb=c=>`rgb(${c.map(v=>Math.round(v)).join(',')})`;
const GOLD=hex('#f7c64a'),GOLD2=hex('#b9832a');
const BW=800,BH=352,cx=400,cy=182,rx=310,ry=130;
function glow(g,x,y,r,col,a){const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,`rgba(${col},${a})`);q.addColorStop(1,`rgba(${col},0)`);g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2)}
function ell(g,x,y,rw,rh,col,lw){g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.ellipse(x,y,rw,rh,0,0,7);g.stroke()}

//# ───── 장별 테마 ─────
const TH={
 1:{name:'1장 — 던전 투기장',bg:'#060911',A:hex('#171d2a'),B:hex('#222a3b'),M:hex('#10141d'),RH:hex('#48546e'),RL:hex('#313b52'),SIDE:'#171d2a',LIFT:[40,96,92],GL:'94,240,180',GL2:'247,198,74',seed:7,
  fx:['투기장 중앙 소울 제단 맥동 + 룬 링 점선이 천천히 회전','상단 벽 기둥 소울 횃불 깜빡임','소울 먼지(녹색·금색)가 떠오름','가장자리 비네트']},
 2:{name:'2장 — 어둠의 숲',bg:'#070612',A:hex('#1c1a2c'),B:hex('#2a2a3a'),M:hex('#0d0c18'),RH:hex('#5a6e58'),RL:hex('#3a4a3e'),SIDE:'#1a1a26',LIFT:[70,120,60],GL:'170,255,100',GL2:'94,240,180',seed:11,
  fx:['반딧불 40마리가 불규칙하게 떠다니며 깜빡임','나뭇잎이 천천히 낙하','캐노피 사이로 연녹색 빛줄기가 맥동','바닥 안개가 느리게 흐름 · 이끼 링 은은한 발광','중앙 제단 연녹색 룬 맥동']},
 3:{name:'3장 — 그림자 성채',bg:'#07060f',A:hex('#1b1a30'),B:hex('#2a284a'),M:hex('#0c0b18'),RH:hex('#5c5a88'),RL:hex('#3c3a62'),SIDE:'#18162a',LIFT:[90,70,150],GL:'181,140,255',GL2:'247,198,74',seed:19,
  fx:['보라 불꽃 입자가 위로 솟구침','성벽 배너 금 문양이 호흡하듯 발광','주기적으로 번개가 번쩍여 성벽이 순간 밝아짐','보라 도깨비불이 투기장 림을 따라 순회','바닥 안개 + 중앙 제단 보라 룬 맥동']}
};

function surround(g,ch,R){
 const T=TH[ch];g.fillStyle=T.bg;g.fillRect(0,0,BW,BH);
 if(ch==1){ //# 석벽
  for(let y=0;y<28;y+=7)for(let x=-((y/7)%2)*8;x<BW;x+=16){g.fillStyle=rgb(mix(T.A,T.B,R()*.8));g.fillRect(x,y,15,6);g.fillStyle='rgba(255,255,255,.04)';g.fillRect(x,y,15,1)}
  for(const px of [66,270,525,730]){g.fillStyle=rgb(T.RL);g.fillRect(px-4,0,8,31);g.fillStyle=rgb(T.RH);g.fillRect(px-4,0,1,31);g.fillStyle=rgb(GOLD2);g.fillRect(px-5,10,10,1);g.fillRect(px-5,24,10,1)}
 }
 if(ch==2){ //# 숲 — 나무 기둥 + 캐노피 + 덤불
  for(const [x0,w] of [[0,30],[44,16],[736,30],[782,18],[684,12]]){for(let x=x0;x<x0+w;x++){const k=.5+.5*Math.sin(x*1.7+hash(x,1)*3);g.fillStyle=rgb(mix([18,14,26],[34,26,36],k*(x<400?(1-x/80):(x-700)/100)));g.fillRect(x,0,1,BH)}g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x0+w-3,0,3,BH)}
  g.fillStyle='#120e26';g.fillRect(0,0,BW,28);
  for(let i=0;i<900;i++){g.fillStyle=`rgba(${40+R()*40|0},${90+R()*70|0},${50+R()*30|0},${.3+R()*.5})`;g.fillRect(R()*BW|0,R()*30|0,1+(R()*2|0),1)}
  for(let x=0;x<BW;x+=60){g.fillStyle='#1e1630';g.fillRect(x+10,20,16,10)}
  g.fillStyle='#0b2a1a';for(let x=0;x<BW;x+=14){const r=5+hash(x,3)*8;g.beginPath();g.arc(x,BH,r,Math.PI,0);g.fill()}
 }
 if(ch==3){ //# 성벽 + 배너 + 기둥
  g.fillStyle='#0e0d1c';for(let x=0;x<BW;x+=22){g.fillRect(x,0,14,7)}
  for(let y=7;y<30;y+=7)for(let x=-((y/7)%2)*8;x<BW;x+=16){g.fillStyle=rgb(mix(T.A,T.B,R()*.8));g.fillRect(x,y,15,6);g.fillStyle='rgba(255,255,255,.04)';g.fillRect(x,y,15,1)}
  for(const px of [66,270,525,730]){g.fillStyle=rgb(T.RL);g.fillRect(px-5,0,10,31);g.fillStyle=rgb(T.RH);g.fillRect(px-5,0,1,31);g.fillStyle=rgb(GOLD2);g.fillRect(px-6,6,12,1);g.fillRect(px-6,26,12,1)}
  g.fillStyle='rgba(180,170,220,.35)';for(const [a,b] of [[66,270],[270,525],[525,730]]){for(let t=0;t<=1;t+=.02){g.fillRect(Math.round(a+(b-a)*t),Math.round(9+Math.sin(t*Math.PI)*8),1,1)}}
  //# 측면 기둥
  for(const [x0,w] of [[0,28],[40,26],[742,26],[772,28]]){g.fillStyle=rgb(mix(T.M,T.A,.7));g.fillRect(x0,0,w,BH);for(let y=14;y<BH;y+=30){g.fillStyle='rgba(255,255,255,.05)';g.fillRect(x0,y,w,1);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x0,y+1,w,1)}}
  g.fillStyle='#0a0914';for(let x=0;x<BW;x+=36){const r=5+hash(x,5)*8;g.beginPath();g.arc(x,BH,r,Math.PI,0);g.fill()}
 }
 //# 상단 금 코니스(UI풍 공통)
 g.fillStyle=rgb(T.M);g.fillRect(0,28,BW,3);g.fillStyle=rgb(GOLD2);g.fillRect(0,31,BW,1);g.fillStyle=rgb(mix(GOLD2,GOLD,.5));g.fillRect(0,32,BW,1);g.fillStyle=rgb(T.RL);g.fillRect(0,33,BW,2);g.fillStyle='#0a0d15';g.fillRect(0,35,BW,3);
 const sh=g.createLinearGradient(0,38,0,80);sh.addColorStop(0,'rgba(0,0,0,.6)');sh.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=sh;g.fillRect(0,38,BW,42);
 if(ch==3){ //# 배너(금 테두리 + 금 문양) — 정적 베이스
  for(const bx of [150,400,650]){g.fillStyle=rgb(GOLD2);g.fillRect(bx-9,8,18,1);g.fillStyle='#5a2480';g.fillRect(bx-8,9,16,24);g.fillStyle='#3a1658';g.fillRect(bx-8,9,2,24);g.fillStyle='#0a0914';g.beginPath();g.moveTo(bx-8,33);g.lineTo(bx,27);g.lineTo(bx+8,33);g.fill();g.fillStyle=rgb(GOLD);g.fillRect(bx-1,15,3,7);g.fillRect(bx-3,17,7,3)}
 }
 //# 링 주변 장식 입자
 if(ch==2)for(let i=0;i<500;i++){const a=R()*7,r=1.06+R()*.22;g.fillStyle=R()<.7?'rgba(110,190,50,.55)':'rgba(60,140,70,.5)';g.fillRect(Math.round(cx+Math.cos(a)*rx*r),Math.round(cy+Math.sin(a)*ry*r),1,1)}
 if(ch==3)for(let i=0;i<380;i++){const a=R()*7,r=1.06+R()*.22;g.fillStyle=R()<.7?'rgba(110,100,255,.55)':'rgba(190,120,230,.5)';g.fillRect(Math.round(cx+Math.cos(a)*rx*r),Math.round(cy+Math.sin(a)*ry*r),1,1)}
}
function arena(g,ch,R){
 const T=TH[ch];
 g.fillStyle='#0b0f18';g.beginPath();g.ellipse(cx,cy+8,rx+1,ry+1,0,0,7);g.fill();
 g.fillStyle=T.SIDE;g.beginPath();g.ellipse(cx,cy+6,rx,ry,0,0,7);g.fill();
 const id=g.createImageData(BW,BH),d=id.data;
 for(let y=0;y<BH;y++)for(let x=0;x<BW;x++){
  const dx=(x-cx)/rx,dy=(y-cy)/ry,r=Math.hypot(dx,dy);if(r>1)continue;let c;
  if(r>0.945){c=mix(T.RL,T.RH,dy<0?.75:.2+((r-.945)/.055)*.2);if(r>.985)c=mix(c,T.M,.55)}
  else{const rr=r/.945,ring=Math.floor(rr*14),fr=rr*14-ring,ang=Math.atan2(dy,dx)/(Math.PI*2)+.5,segs=Math.max(8,Math.round(ring*4.4)+6),sa=ang*segs,seg=Math.floor(sa),h=hash(ring,seg);
   c=mix(T.A,T.B,.15+h*.7);if(fr<.1||(sa-seg)<.05)c=mix(c,T.M,.6);else if(fr>.9)c=mix(c,T.RL,.18);
   c=mix(c,T.LIFT,Math.max(0,1-rr*1.25)*.30);c=mix(c,T.M,Math.max(0,(rr-.7)/.3)*.35);
   if(ch==2&&h>.9)c=mix(c,[60,100,50],.18)}
  if(r>.895&&r<.905)c=mix(c,GOLD2,.85);
  const i=(y*BW+x)*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255}
 const t=document.createElement('canvas');t.width=BW;t.height=BH;t.getContext('2d').putImageData(id,0,0);g.drawImage(t,0,0);
 for(let k=0;k<12;k++){const a=k/12*Math.PI*2,x=Math.round(cx+Math.cos(a)*rx*.965),y=Math.round(cy+Math.sin(a)*ry*.965);g.fillStyle=rgb(GOLD);g.fillRect(x-1,y-1,3,2);g.fillStyle=rgb(GOLD2);g.fillRect(x-1,y+1,3,1)}
 for(let i=0;i<70;i++){const a=R()*7,r=Math.sqrt(R())*.85;g.fillStyle=R()<.3?'rgba(120,30,40,.35)':'rgba(0,0,0,.25)';g.fillRect(Math.round(cx+Math.cos(a)*rx*r),Math.round(cy+Math.sin(a)*ry*r),1+(R()*3|0),1)}
}
function makeScene(ch){
 const T=TH[ch],R=rng(T.seed),st=document.createElement('canvas');st.width=BW;st.height=BH;const g=st.getContext('2d');
 surround(g,ch,R);arena(g,ch,R);
 const P=[];const n=ch==1?46:ch==2?40:60;
 for(let i=0;i<n;i++)P.push({x:Math.random()*BW,y:Math.random()*BH,s:.1+Math.random()*.25,p:Math.random()*6,c:ch==1?(Math.random()<.8?T.GL:T.GL2):ch==2?(Math.random()<.85?T.GL:T.GL2):(Math.random()<.8?T.GL:T.GL2),vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3});
 const leaves=Array.from({length:14},()=>({x:Math.random()*BW,y:Math.random()*BH,p:Math.random()*6,s:.18+Math.random()*.2}));
 let flash=0,nextFlash=3000;
 return function(c,t){
  c.globalCompositeOperation='source-over';c.drawImage(st,0,0);c.globalCompositeOperation='lighter';
  const pul=.6+.4*Math.sin(t/900);
  //# 공통: 룬 링 + 중앙 제단
  for(let k=0;k<48;k++){const a=k/48*Math.PI*2+t/9000,x=cx+Math.cos(a)*rx*.55,y=cy+Math.sin(a)*ry*.55,l=.5+.5*Math.sin(t/600+k);c.fillStyle=`rgba(${T.GL},${.14+.32*l*pul})`;c.fillRect(Math.round(x),Math.round(y),2,1)}
  ell(c,cx,cy,rx*.13,ry*.13,`rgba(${T.GL},${.5+.4*pul})`,1.5);ell(c,cx,cy,rx*.085,ry*.085,`rgba(${T.GL},${.3+.3*pul})`,1);glow(c,cx,cy,70,T.GL,.10+.08*pul);
  if(ch==1){for(const px of [66,270,525,730]){const f=.7+.3*Math.sin(t/110+px);glow(c,px,16,34,T.GL,.30*f);c.fillStyle=`rgba(143,247,207,${.8*f})`;c.fillRect(px-1,12,2,4);c.fillStyle=`rgba(255,255,255,${.7*f})`;c.fillRect(px,14,1,2)}}
  if(ch==2){
   //# 빛줄기
   for(const [x0,k] of [[160,0],[300,1],[470,2],[620,3]]){const a=.04+.03*Math.sin(t/1300+k*1.7);const q=c.createLinearGradient(x0,0,x0+90,330);q.addColorStop(0,`rgba(170,255,140,${a*2})`);q.addColorStop(1,'rgba(170,255,140,0)');c.fillStyle=q;c.beginPath();c.moveTo(x0,30);c.lineTo(x0+26,30);c.lineTo(x0+130,330);c.lineTo(x0+50,330);c.fill()}
   //# 이끼 링 발광
   for(let k=0;k<60;k++){const a=k/60*Math.PI*2,l=.5+.5*Math.sin(t/700+k);c.fillStyle=`rgba(150,255,90,${.08+.18*l})`;c.fillRect(Math.round(cx+Math.cos(a)*rx*1.12),Math.round(cy+Math.sin(a)*ry*1.12),2,1)}
   //# 낙엽
   for(const l of leaves){l.y+=l.s;l.x+=Math.sin(t/900+l.p)*.35;if(l.y>BH+4){l.y=-4;l.x=Math.random()*BW}c.fillStyle=`rgba(160,190,70,.55)`;c.fillRect(l.x|0,l.y|0,2,1)}
  }
  if(ch==3){
   //# 배너 발광
   for(const bx of [150,400,650]){const l=.5+.5*Math.sin(t/800+bx);glow(c,bx,20,24,'247,198,74',.10+.10*l);c.fillStyle=`rgba(247,198,74,${.35+.35*l})`;c.fillRect(bx-1,15,3,7);c.fillRect(bx-3,17,7,3)}
   //# 도깨비불 — 림 순회
   for(let i=0;i<3;i++){const a=t/3500+i*2.09,x=cx+Math.cos(a)*rx*.97,y=cy+Math.sin(a)*ry*.97;glow(c,x,y,22,'150,130,255',.34);c.fillStyle='rgba(210,200,255,.9)';c.fillRect(Math.round(x)-1,Math.round(y)-1,3,3)}
   //# 번개
   if(t>nextFlash){flash=1;nextFlash=t+4000+Math.random()*4000}
   if(flash>0){c.fillStyle=`rgba(200,180,255,${.22*flash})`;c.fillRect(0,0,BW,60);glow(c,Math.random()*BW,20,90,'190,170,255',.25*flash);flash-=.05}
  }
  //# 안개(2·3장)
  if(ch>1){for(let i=0;i<4;i++){const x=((t/60+i*220)%1000)-120,a=.05+.02*Math.sin(t/1500+i);glow(c,x,BH-40+i*6,120,ch==2?'120,200,150':'150,130,220',a)}}
  //# 입자
  for(const e of P){if(ch==2){e.x+=e.vx+Math.sin(t/1300+e.p)*.25;e.y+=e.vy+Math.cos(t/1100+e.p)*.2;if(e.x<0)e.x=BW;if(e.x>BW)e.x=0;if(e.y<40)e.y=BH;if(e.y>BH)e.y=60;
    const l=.3+.7*Math.sin(t/500+e.p)**2;glow(c,e.x,e.y,6,e.c,.25*l);c.fillStyle=`rgba(${e.c},${.5+.4*l})`;c.fillRect(e.x|0,e.y|0,1,1)}
   else{e.y-=e.s*(ch==3?1.6:1);e.x+=Math.sin(t/1400+e.p)*.15;if(e.y<-4){e.y=BH+4;e.x=Math.random()*BW}c.fillStyle=`rgba(${e.c},${.25+.35*Math.sin(t/500+e.p)**2})`;c.fillRect(Math.round(e.x),Math.round(e.y),1,ch==3?2:1)}}
  c.globalCompositeOperation='source-over';
  const v=c.createRadialGradient(cx,BH/2,BH*.28,cx,BH/2,BW*.62);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(2,4,10,.62)');c.fillStyle=v;c.fillRect(0,0,BW,BH);
 }
}
//# ───── 페이지 조립 ─────
const root=document.getElementById('root'),draws=[];
[1,2,3].forEach(ch=>{
 const T=TH[ch],s=document.createElement('section');
 s.innerHTML=`<h2>${T.name}</h2><div class="ctl"><button data-v="100">전(현재)</button><input type="range" min="0" max="100" value="50"><button data-v="0">후(시안)</button></div>
 <div class="cmp" style="--x:50%"><img src="_cmp/ch${ch}_before.png" alt=""><canvas width="${BW}" height="${BH}"></canvas><div class="ln"></div><span class="tag l">전 · 현재</span><span class="tag r">후 · 시안</span></div>
 <ul>${T.fx.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 root.appendChild(s);
 const box=s.querySelector('.cmp'),rg=s.querySelector('input'),set=v=>{rg.value=v;box.style.setProperty('--x',v+'%')};
 rg.oninput=()=>set(rg.value);s.querySelectorAll('button').forEach(b=>b.onclick=()=>set(b.dataset.v));
 draws.push([s.querySelector('canvas').getContext('2d'),makeScene(ch)]);
});
requestAnimationFrame(function f(t){draws.forEach(([c,d])=>d(c,t));requestAnimationFrame(f)});
</script>
</body>
</html>
